const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pp=s=>{const o={};s.replace(/([A-Z]\d?):(-?\d+),(-?\d+)/g,(_,k,x,y)=>{o[k]=[+x,+y]});return o};
function fig(id,dur=2.6){
  const f=FIG[id]||FIG.curl,a=pp(f.a),b={...a,...pp(f.b||'')};
  const an=(attr,va,vb)=>RM||va===vb?'':`<animate attributeName="${attr}" values="${va};${vb};${va}" dur="${dur}s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>`;
  const seg=(p,q,w,cls='lim')=>a[p]&&a[q]?`<line class="${cls}" stroke-width="${w}" x1="${a[p][0]}" y1="${a[p][1]}" x2="${a[q][0]}" y2="${a[q][1]}">${an('x1',a[p][0],b[p][0])}${an('y1',a[p][1],b[p][1])}${an('x2',a[q][0],b[q][0])}${an('y2',a[q][1],b[q][1])}</line>`:'';
  const dot=(k,r,cls)=>`<circle class="${cls}" r="${r}" cx="${a[k][0]}" cy="${a[k][1]}">${an('cx',a[k][0],b[k][0])}${an('cy',a[k][1],b[k][1])}</circle>`;
  let s=f.eq||'';
  if(a.C)s+=seg('C','W',1.2,'cab');
  if(f.bar)s+=seg('W','W2',4,'eq');
  s+=seg('P','K2',8)+seg('K2','A2',7)+seg('N','P',10)+seg('P','K',8)+seg('K','A',7)+seg('A','T',5);
  if(a.S1)s+=seg('S1','S2',8)+seg('S1','E',7)+seg('E','W',6)+seg('S2','E2',7)+seg('E2','W2',6);
  else s+=seg('N','E',7)+seg('E','W',6);
  s+=dot('H',8,'hd');(f.wt||[]).forEach(k=>s+=dot(k,5.5,'wt'));
  return `<svg class="fig" viewBox="0 0 160 120" aria-hidden="true">${s}</svg>`;
}

  return `<svg class="spark" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--violet)" stroke-width="2.5"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--violet)"/>`).join('')}</svg>`}
// Best result. A pyramid only compares runs of its biggest peak: the half is not a faster full one.
const best=id=>{let l=S.circLog.filter(x=>x.id===id);if(!l.length)return null;const c=CIRCUITS.find(x=>x.id===id);if(c.type==='ladder'){const pk=Math.max(...l.map(x=>x.peak||0));l=l.filter(x=>(x.peak||0)===pk)}return c.type==='amrap'?Math.max(...l.map(x=>x.score)):Math.min(...l.map(x=>x.score))};
const bestPeak=id=>Math.max(0,...S.circLog.filter(x=>x.id===id).map(x=>x.peak||0));

// from = when the phase before it really ended. After the phone slept through part of a circuit, the phases that passed are
// stepped through on the clock (silently) instead of starting the current one over.
function runPhase(phase,secs,from){const r=UI.run;r.phase=phase;r.end=(from||Date.now())+secs*1000;if(r.end>Date.now()){beep(phase==='work'?1040:660,phase==='work'?260:160);buzz(phase==='work'?[80,60,80]:60);renderOver()}}
function runAdvance(from){const r=UI.run,c=r.c;
  if(r.phase==='work'){if(r.i+1<c.st.length)runPhase('rest',c.rest,from);else if(r.round<c.rounds)runPhase('rr',c.rr,from);else finishRun(Math.round(((from||Date.now())-r.t0)/1000))}
  else{if(r.phase==='rr'){r.round++;r.i=0}else if(r.phase!=='ready')r.i++;runPhase('work',c.work,from)}}
function finishRun(score){const r=UI.run;r.phase='done';r.score=score;keepAwake(false);beep(1320,400);
  if(r.c.type==='amrap')S.circLog.push({id:r.c.id,d:TODAY,score:r.rounds});
  else if(r.c.type!=='ladder'||r.step>=r.seq.length)S.circLog.push({id:r.c.id,d:TODAY,score,peak:r.peak});
  save();renderOver()}
setInterval(()=>{const r=UI.run;
  if(r&&r.phase!=='done'){
    if(r.c.type==='amrap'){if(Date.now()>=r.end)finishRun(0);else{const left=Math.ceil((r.end-Date.now())/1000),el=$('.over .clock');if(el)el.textContent=Math.floor(left/60)+':'+pad(left%60)}}
    else if(r.c.type==='ladder'){const el=$('.over .label');if(el){const s=Math.floor((Date.now()-r.t0)/1000);el.textContent=`Round ${r.step+1}/${r.seq.length} · ${Math.floor(s/60)}:${pad(s%60)}`}}
    else if(!r.paused){const left=Math.ceil((r.end-Date.now())/1000);if(left<=3&&left>0&&left!==r.lastBeep){r.lastBeep=left;beep(520,90)}if(Date.now()>=r.end){let n=0;while(r.phase!=='done'&&Date.now()>=r.end&&n++<400)runAdvance(r.end);if(r.phase!=='done')renderOver()}else{const el=$('.over .clock');if(el)el.textContent=Math.max(0,left)}}}
  if(UI.hold){const el=$('#holdclock');if(el)el.textContent=((Date.now()-UI.hold.t0)/1000).toFixed(1)}
  if(UI.timerEnd){renderTimer();if(Date.now()>UI.timerEnd+8000){UI.timerEnd=0;renderTimer()}}},250);

   <button class="btn" data-a="exinfo" data-id="${x.id}">Progress and form cues</button>
   <button class="btn" data-a="swapopen" data-mode="active" data-x="${s.x}">Swap for another exercise</button>
   <button class="btn" data-a="exremove" style="color:var(--bad)">Remove from today</button>`}
  if(s.kind==='editday'){const p=S.program.find(d=>d.id===s.day);if(!p){UI.sheet=null;return ''}body=`<h2>Edit ${esc(p.name)}</h2><p class="small muted">Permanent: every change here saves to your plan for all future ${esc(p.name)} sessions.${S.active&&S.active.day===p.id?' Today\'s session in progress keeps its own list.':''}</p>
   <div class="field"><label class="label" for="dName">Name</label><input id="dName" value="${esc(p.name)}" data-c="dayname"></div>
   <div class="field"><span class="label">Day</span><div class="seg">${[1,2,3,4,5,6,0].map(dw=>`<button class="${p.dow===dw?'on':''}" data-a="daydow" data-v="${dw}">${DOW[dw][0]}</button>`).join('')}</div></div>
   <div class="list">${p.ex.map((e,i)=>{const d=def(e.x);return `<div class="li"><div class="figbox" style="width:56px">${exMedia(d.id)}</div><div class="grow"><b class="small">${esc(d.n)}</b><div class="row" style="gap:4px;margin-top:4px"><button class="icon-btn s" data-a="pmove" data-x="${i}" data-d="-1" aria-label="Move up">↑</button><button class="icon-btn s" data-a="pmove" data-x="${i}" data-d="1" aria-label="Move down">↓</button><button class="icon-btn s" data-a="swapopen" data-mode="plan" data-x="${i}" aria-label="Swap">⇄</button><button class="icon-btn s" data-a="prm" data-x="${i}" aria-label="Remove">${I.x}</button></div></div>
     <div class="stepper"><button data-a="psets" data-x="${i}" data-d="-1" aria-label="Fewer sets">−</button><b>${e.s}</b><button data-a="psets" data-x="${i}" data-d="1" aria-label="More sets">+</button></div></div>`}).join('')}</div>
   <button class="btn" data-a="swapopen" data-mode="planadd">+ Add exercise</button>
   <p class="small muted">${p.ex.length} exercises · ${p.ex.reduce((a,e)=>a+e.s,0)} sets · ~${Math.round(p.ex.reduce((a,e)=>a+e.s,0)*3.5+10)} min. The muscle map updates as you edit.</p>
   ${!DEFAULT_PROGRAM.some(d=>d.id===p.id)?'':s.rconf?`<div class="row"><button class="btn grow" data-a="dayresetno">Keep my edits</button><button class="btn grow" style="color:var(--bad)" data-a="dayresetyes">Reset ${esc(p.name)}</button></div>`:`<button class="btn ghost" data-a="dayreset">Reset this day to the default</button>`}`}
  if(s.kind==='food'){const f=s.f,pg=portionG(f.p),dn=foodDayNow(),where=(UI.slotT!=null&&typeof SLOT_T!=='undefined'?' to '+SLOT_N[SLOT_T.indexOf(UI.slotT)].toLowerCase():dn===TODAY?' to today':' to '+fmtDate(dn));
   body=`<h2>${esc(f.n)}</h2><p class="small muted">1 portion = ${esc(f.p)} · ${fmt(f.k)} kcal · ${f.pr} g protein${f.url?` · <a href="${esc(f.url)}" target="_blank" rel="noopener" style="color:var(--violet)">source</a>`:''}</p>
   <div class="field"><span class="label">Portions</span><div class="seg" id="fpseg">${[0.5,1,1.5,2].map(x=>`<button class="${s.x===x?'on':''}" data-a="portion" data-x="${x}">${xTxt(x)}</button>`).join('')}</div></div>
   ${pg?`<div class="row"><input id="fpG" class="num" type="number" inputmode="decimal" value="${Math.round(pg.G*s.x)}" data-c="fpg" data-g="${pg.G}" aria-label="Amount in ${pg.u}" style="width:110px"><span class="small muted grow">${pg.u} · or type how much you ate</span></div>`:''}
   <div id="fstat">${stat3(f,s.x)}</div>
   <button class="btn primary block" data-a="addfood">Add${where}</button>`}
  if(s.kind==='food100'){const r=s.r;body=`<h2>${esc(r.n)}</h2><p class="small muted">${r.src==='usda'?'USDA lab data':'Open Food Facts label'} · per 100 g: ${fmt(r.k)} kcal · ${g1(r.pr)} P · ${g1(r.c)} C · ${g1(r.f)} F${r.fi?' · '+g1(r.fi)+' fiber':''}</p>${r.pr==null||r.c==null||r.f==null?'<p class="tiny muted">"?" means the label does not say. It counts as 0.</p>':''}
   <div class="row"><input id="dbG" class="num" type="number" inputmode="decimal" value="${s.g}" data-c="dbg" aria-label="Grams eaten" style="width:110px"><span class="small muted grow">grams</span></div>
   <div class="row wrap" style="gap:6px">${[...new Set([r.serv,50,100,150,200,300].filter(Boolean))].map(g=>`<button class="chip${s.g===g?' on':''}" data-a="dbg" data-g="${g}">${g} g${g===r.serv?' (1 serving)':''}</button>`).join('')}</div>
   <div id="dbstat">${stat3(r,(s.g||0)/100)}</div>
   <div class="grid2"><button class="btn primary" data-a="dbadd">Add</button><button class="btn" data-a="dbadd" data-keep="1">Add + save to list</button></div>
   <p class="small muted">Weigh it cooked if the name says cooked, raw if it says raw.</p>`}
  if(s.kind==='custom'){body=`<h2>Custom item</h2>
   <div class="field"><label class="label" for="cfN">Name</label><input id="cfN" placeholder="e.g. Crunchwrap Supreme"></div>
   <div class="field"><label class="label" for="cfP">Portion</label><input id="cfP" placeholder="e.g. 1 regular"></div>
   <div class="grid2">${[['cfK','kcal'],['cfPr','Protein g'],['cfC','Carbs g'],['cfF','Fat g']].map(([id,l])=>`<div class="field"><label class="label" for="${id}">${l}</label><input id="${id}" class="num" type="number" inputmode="numeric"></div>`).join('')}</div>
   <div class="field"><label class="label" for="cfS">Where the numbers come from</label><select id="cfS"><option value="">My estimate</option><option value="label">Package label</option><option value="official">Official restaurant site</option></select></div>
   <div class="field"><label class="label" for="cfU">Source link</label><input id="cfU" type="url" placeholder="https://"></div>
   <button class="btn primary block" data-a="savecustom">Save and add to today</button>`}
  if(s.kind==='wconfirm'){body=`<h2>${s.kg} kg at ${s.t}</h2>
   <p class="small">It's outside the morning window. Did you weigh right after waking, after the toilet, before any food or water?</p>
   <div class="row"><button class="btn grow primary" data-a="wyes">Yes, fasted</button><button class="btn grow" data-a="wno">No, I've eaten</button></div>
   <p class="small muted">Food and water add 1-2 kg by evening. Non-fasted weigh-ins are kept but left out of the trend and check-ins.</p>`}
  if(s.kind==='wedit'){const ws=[...S.weights].filter(w=>!w.sample).sort((a,b)=>a.d<b.d?1:-1);body=`<h2>Weigh-ins</h2>
   <div class="card stack"><p class="label">Add or replace a day</p>
    <div class="row"><input id="wdD" type="date" max="${TODAY}" value="${addDays(TODAY,-1)}" aria-label="Date" style="flex:1.3"><input id="wdK" class="num" type="number" inputmode="decimal" step="0.1" placeholder="kg" aria-label="Weight in kg" style="flex:1"></div>
    <label class="row" style="gap:8px"><input id="wdF" type="checkbox" checked style="width:20px;height:20px"><span class="small">Fasted morning weigh-in</span></label>
    <button class="btn primary" data-a="wadd">Save</button></div>
   <div class="stack">${ws.map(w=>`<div class="row between card flat" style="padding:10px 12px"><div><b>${w.kg} kg</b> <span class="small muted">${fmtDate(w.d)}${w.t?' · '+w.t:''}</span></div>
     <div class="row" style="gap:6px"><button class="chip ${w.fasted===false?'warn':'good'}" data-a="wtog" data-d="${w.d}">${w.fasted===false?'Not fasted':'Fasted'}</button><button class="icon-btn s" data-a="wdel" data-d="${w.d}" aria-label="Delete ${fmtDate(w.d)}">${I.x}</button></div></div>`).join('')||'<p class="small muted">No weigh-ins yet.</p>'}</div>
   <p class="small muted">Tap Fasted / Not fasted to switch. Only fasted ones count toward the trend.</p>`}
  if(s.kind==='shake'){const last=S.profile.shake||{},sp=S.supps[TODAY]||{},crOk=hasSupp('cr'),fe=sp.feAt!=null&&sp.feAt+60>nowMinD()?sp.feAt+60:null;
   body=`<h2>Protein shake</h2><p class="small muted">Rule 1 whey and semi-skimmed milk${crOk?', plus creatine':''}, logged as one item.</p>
   ${fe!=null?`<p class="small"><b class="hi">Iron was less than an hour ago.</b> Milk and whey block it. Better after ${hm(fe)}.</p>`:''}
   <div class="stack">${[1,1.5,2].map(v=>{const x=shakeItem(v,false);return `<button class="btn block${last.sc===v?' primary':''}" data-a="shake" data-v="${v}">${v} scoop${v>1?'s':''} · ${x.ml} ml milk <span class="small${last.sc===v?'':' muted'}">· ${x.k} kcal · ${x.pr} g protein</span></button>`}).join('')}</div>
   ${crOk?`<label class="row" style="gap:8px"><input id="shCr" type="checkbox" ${!sp.cr&&last.cr!==false?'checked':''} style="width:20px;height:20px"><span class="small">5 g creatine in it${sp.cr?' (creatine already ticked today)':''}</span></label>`:''}`}
  if(s.kind==='steps'){body=`<h2>Steps today</h2><input id="stIn" class="num" type="number" inputmode="numeric" placeholder="e.g. 6500" aria-label="Steps"><button class="btn primary block" data-a="logsteps">Save</button>${hook('steps')}`}
  if(s.kind==='max'){const m=MOVES.find(x=>x.id===s.m),h=S.gtg.max[m.id]||[];body=`<h2>${m.n}: ${m.u==='s'?'best hold':'max test'}</h2><p class="small">${m.u==='s'?'Fresh, forearms down, one straight line. Stop the clock when your hips sag or drop.':'Fresh, after a warm-up, one all-out set with clean reps only.'}</p>
   ${m.u==='s'?`<div class="holdclock" id="pclock">${UI.pt?Math.floor((Date.now()-UI.pt)/1000):s.v||0}</div><button class="btn block" data-a="ptime">${UI.pt?'Stop':'Start clock'}</button>`:''}
   <input id="mxIn" class="num" type="number" inputmode="numeric" placeholder="${m.u==='s'?'seconds':'reps'}" value="${s.v||''}" aria-label="Max"><button class="btn primary block" data-a="savemax" data-m="${m.id}">Save</button>
   ${h.length?`<div class="list">${h.map((x,i)=>[x,i]).reverse().slice(0,8).map(([x,i])=>`<div class="li small"><span class="grow">${fmtDate(x.d)}${x.src==='set'?' · daily set':x.src==='gym'?' · in the gym':''}</span><b>${fmtV(m.id,x.v)}</b><button class="icon-btn s" data-a="maxrm" data-m="${m.id}" data-i="${i}" aria-label="Delete this max">${I.x}</button></div>`).join('')}</div><p class="tiny muted">Typed a wrong max? Delete it: your set size goes back to the one before.</p>`:''}`}
  if(s.kind==='remind'){const r=S.gtg.remind;body=`<h2>Rep windows</h2>
   <div class="grid2"><div class="field"><label class="label" for="rS">First</label><input id="rS" type="time" value="${r.start}" data-c="remind" data-f="start"></div><div class="field"><label class="label" for="rE">Last</label><input id="rE" type="time" value="${r.end}" data-c="remind" data-f="end"></div></div>
   <div class="field"><span class="label">Gap after each set</span><div class="seg">${[60,90,120,180].map(v=>`<button class="${r.every===v?'on':''}" data-a="remindevery" data-v="${v}">${v<120?v+' min':v/60+' h'}</button>`).join('')}</div></div>
   <p class="small muted">The first reminder comes at "First". After that, each one comes ${everyTxt(r.every)} after the last set you log, so nothing piles up while you're busy. ${hook('gtgNote')}</p>`}
  if(s.kind==='circ'){const c=CIRCUITS.find(x=>x.id===s.id),o=s.o;
   body=`<div class="row" style="gap:6px"><h2>${c.n}</h2>${c.tag?`<span class="tag v">${c.tag}</span>`:''}</div><p class="small muted">${c.d}</p>
   <div class="list">${c.st.map(([n,reps,g])=>`<div class="li"><div class="figbox" style="width:64px">${gMedia(g,n)}</div><span class="grow"><b>${n}</b></span>${c.type!=='timed'?`<span class="num" style="font-size:22px">${c.type==='ladder'?reps+'×':reps}</span>`:''}</div>`).join('')}</div>
   ${c.type==='amrap'?`<div class="field"><span class="label">Minutes</span><div class="seg">${[10,15,20].map(v=>`<button class="${o.min===v?'on':''}" data-a="circopt" data-k="min" data-v="${v}">${v}</button>`).join('')}</div></div>
     <p class="small muted">Scale it: chin-ups or jumping pull-ups, knee push-ups. Log rounds as you finish each.</p>`:''}
   ${c.type==='ladder'?`<div class="field"><span class="label">Peak round</span><div class="seg">${[5,7,10].map(v=>`<button class="${o.peak===v?'on':''}" data-a="circopt" data-k="peak" data-v="${v}">${v}${v===10?' (full)':v===5?' (half)':''}</button>`).join('')}</div></div>
     <p class="small muted">Peak ${o.peak}: ${o.peak*o.peak} pull-ups, ${o.peak*o.peak*2} dips, ${o.peak*o.peak*3} push-ups, ${o.peak*o.peak*4} sit-ups, ${o.peak*o.peak*5} squats in total.</p>`:''}
   ${c.type==='timed'?[['work','Work (s)',[30,40,45,60]],['rest','Rest (s)',[10,15,20,30]],['rounds','Rounds',[2,3,4,5]]].map(([k,l,opts])=>`<div class="field"><span class="label">${l}</span><div class="seg">${opts.map(v=>`<button class="${o[k]===v?'on':''}" data-a="circopt" data-k="${k}" data-v="${v}">${v}</button>`).join('')}</div></div>`).join(''):''}
   <button class="btn primary block" data-a="runstart">Start</button>`}
  if(s.kind==='sk')body=skSheet(s);
  if(s.kind==='recap')body=recapSheet(s);
  if(s.kind==='bigph'){const d=def(s.id);body=`${exMedia(s.id,'big')}<h2>${esc(d.n)}</h2><p class="small muted">${Object.keys(d.m).map(k=>MUSC[k]).join(', ')} · ${d.r[0]}–${d.r[1]} reps</p><ul class="cues">${(CUES[d.g]||[]).map(c=>`<li>${c}</li>`).join('')}</ul>${NOTES[s.id]?`<p class="small">${NOTES[s.id]}</p>`:''}`}
  if(s.kind==='resched'){const p=dayForDate(s.d)||S.program.find(x=>x.id===s.id),bd=p?betterDays(s.d,p):[];body=`<h2>Move ${p?esc(p.name):'session'}</h2>
   <p class="small muted">Best days in the next week, ranked by recovery: no hitting the same muscles two days in a row.</p>
   <div class="stack">${bd.map((b,i)=>`<button class="card stack" data-a="reschmove" data-from="${s.d}" data-to="${b.d}" data-id="${p.id}" data-past="${s.d<TODAY?1:''}" style="text-align:left;width:100%"><div class="row between"><h3>${fmtDate(b.d)}</h3><span class="chip ${b.clean?'good':'warn'}">${i===0?'Best':b.clean?'Clean':'Some overlap'}</span></div><p class="small">${b.why}</p></button>`).join('')||'<p class="small muted">No free day this week.</p>'}</div>
   ${s.d>=TODAY?`<button class="btn ghost" data-a="reschskip" data-from="${s.d}">Skip it this week</button>`:''}
   ${Object.keys(S.resched).some(reschThisWeek)?`<button class="btn ghost" data-a="reschreset">Undo all moves this week</button>`:''}`}
  if(!body&&typeof sheetX==='function')body=sheetX(s);
  return `<div class="sheet-bg" data-a="closesheet"><div class="sheet stack${s.kind==='plus'?' plus':''}" role="dialog" aria-modal="true"><div class="sheet-head"><span class="grab"></span><span></span><button class="icon-btn s" data-a="closesheet" aria-label="Close">${I.x}</button></div>${body}</div></div>`;
}

  if(c==='fx'){const v=parseFloat(t.value),en=feCur();if(v>0&&en){en.x=Math.round(v*100)/100;keepImp(en,UI.sheet.d);save();render()}return}
  if(c==='remind'&&t.value){const r=S.gtg.remind,f=t.dataset.f,n={...r,[f]:t.value};if(n.start>=n.end){t.value=r[f];return toast('"First" has to be earlier than "Last"')}r[f]=t.value;save();render()}
  if(c==='ghost'){S.profile.ghost=t.checked;save();render()}
  if(c==='dayname'){const p=S.program.find(p=>p.id===UI.sheet.day);p.name=t.value.trim()||p.name;save();render()}
  if(c==='ph'&&t.files[0]){UI.ph[t.dataset.k]=URL.createObjectURL(t.files[0]);render()}
  if(c==='importfile'&&t.files[0]){t.files[0].text().then(txt=>{let j;try{j=JSON.parse(txt)}catch(_){return toast('That file is not a backup')}
    const d=j&&j.data;if(!j||j.app!=='recomp-coach'||!d||typeof d!=='object'||!d.profile||typeof d.profile!=='object'||!Array.isArray(d.weights)||!Array.isArray(d.log))return toast('That file is not a Tally backup');
    UI.sheet.pending=d;UI.sheet.pendingWhen=j.saved?fmtDate(ymd(new Date(j.saved))):'?';renderSheet()})}});
// Day rollover: the app may stay open past midnight, so re-check the date when it comes back and every minute.
// Past midnight: redraw now, or as soon as you leave the box you're typing in (so nothing you typed is lost).
function checkDay(){const d=dayNow();if(d!==TODAY){TODAY=d;if(!document.querySelector('input:focus,textarea:focus'))render();else document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.querySelector('input:focus,textarea:focus'))render()},50),{once:true})}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDay();if((UI.run&&UI.run.phase!=='done')||UI.ht)keepAwake(true)}});addEventListener('focus',checkDay);setInterval(checkDay,60000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
